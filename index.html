<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>プログラミングクイズ企画 意見・感想集約サイト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f4f5f8;
      color: #1e293b;
    }
    .pop-shadow {
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
    }
    .pop-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-400 text-indigo-950 font-black flex items-center justify-center text-xl shadow-inner select-none">
          ?
        </div>
        <div>
          <h1 class="font-black text-lg sm:text-xl tracking-tight leading-tight">プログラミングクイズ企画 意見ボックス</h1>
          <p class="text-xs text-indigo-200 hidden sm:block">みんなでつくる初心者向けプログラミングクイズ</p>
        </div>
      </div>

      <!-- ログイン済みのときだけ管理用ナビゲーションを表示 -->
      <div id="headerActions" class="flex items-center gap-2"></div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 sm:py-8 space-y-8">

    <!-- ========================================== -->
    <!-- 1. トップページ（一般参加者・全員閲覧可能） -->
    <!-- ========================================== -->
    <div id="publicView" class="space-y-8">

      <!-- ホスト（管理者）からのお知らせボード -->
      <section class="bg-white rounded-2xl border-2 border-indigo-200 shadow-sm overflow-hidden">
        <div class="bg-indigo-600 px-5 py-3 flex items-center justify-between">
          <div class="flex items-center gap-2 text-white font-bold">
            <svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
            </svg>
            <span>お知らせ</span>
          </div>
          <span id="noticeUpdatedAt" class="text-xs text-indigo-100 bg-indigo-700/70 px-2.5 py-1 rounded-full"></span>
        </div>
        <div class="p-5 sm:p-6">
          <h2 id="noticeTitle" class="text-lg sm:text-xl font-black text-slate-800 mb-2"></h2>
          <p id="noticeBody" class="text-slate-700 text-sm sm:text-base leading-relaxed whitespace-pre-wrap"></p>
        </div>
      </section>

      <!-- お知らせ欄の下：クイズ解説コーナー -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-7">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-5">
          <div>
            <span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full mb-1.5">振り返り・復習</span>
            <h2 class="text-xl sm:text-2xl font-black text-slate-800">クイズ解説</h2>
          </div>
          <span id="explanationUpdatedAt" class="text-xs text-slate-400"></span>
        </div>

        <p id="explanationNote" class="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap mb-5"></p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- 今日の解説 -->
          <div class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 flex flex-col justify-between gap-3">
            <div>
              <span class="inline-block text-[11px] font-bold bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-md mb-2">解説資料</span>
              <h3 class="font-bold text-slate-800 text-base">今日の解説</h3>
            </div>
            <div id="expTodayUrlBox"></div>
          </div>

          <!-- pythonプログラム原文 -->
          <div class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 flex flex-col justify-between gap-3">
            <div>
              <span class="inline-block text-[11px] font-bold bg-sky-100 text-sky-800 px-2.5 py-0.5 rounded-md mb-2">Python</span>
              <h3 class="font-bold text-slate-800 text-base">pythonプログラム原文</h3>
            </div>
            <div id="expPythonUrlBox"></div>
          </div>

          <!-- スクラッチプログラム原文 -->
          <div class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 flex flex-col justify-between gap-3">
            <div>
              <span class="inline-block text-[11px] font-bold bg-orange-100 text-orange-800 px-2.5 py-0.5 rounded-md mb-2">Scratch</span>
              <h3 class="font-bold text-slate-800 text-base">スクラッチプログラム原文</h3>
            </div>
            <div id="expScratchUrlBox"></div>
          </div>
        </div>
      </section>

      <!-- ========================================== -->
      <!-- フォームA：クイズの問題リクエスト欄          -->
      <!-- ========================================== -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-7">
        <div class="mb-6">
          <div class="flex items-center gap-2 mb-2">
            <span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full">問題リクエスト</span>
            <span class="text-xs font-bold text-rose-600">※すべての項目が必須です</span>
          </div>
          <h2 class="text-xl sm:text-2xl font-black text-slate-800">クイズの問題リクエストを送る</h2>
          <p class="text-sm text-slate-500 mt-1">
            「こんなテーマの問題を出してほしい」「この形式で出題してほしい」など、自由にお書きください。
          </p>
        </div>

        <form id="opinionForm" class="space-y-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- 先生・生徒番号（必須） -->
            <div>
              <label for="reqRoleNumber" class="block text-sm font-bold text-slate-700 mb-1.5">
                先生の場合は先生と書き生徒の場合は番号を書いてください <span class="text-rose-500 text-xs font-bold">（必須）</span>
              </label>
              <input
                type="text"
                id="reqRoleNumber"
                required
                placeholder="例：先生 / 15"
                maxlength="20"
                class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>

            <!-- ニックネーム（必須） -->
            <div>
              <label for="senderName" class="block text-sm font-bold text-slate-700 mb-1.5">
                ニックネーム <span class="text-rose-500 text-xs font-bold">（必須）</span>
              </label>
              <input
                type="text"
                id="senderName"
                required
                placeholder="例：パイソン太郎"
                maxlength="30"
                class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- コードの種類（必須：スクラッチ・パイソン・その他） -->
            <div>
              <label for="codeType" class="block text-sm font-bold text-slate-700 mb-1.5">
                コードの種類 <span class="text-rose-500 text-xs font-bold">（必須）</span>
              </label>
              <select
                id="codeType"
                required
                class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm bg-white focus:outline-none focus:ring-2
